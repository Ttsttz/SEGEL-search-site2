<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gene PDF Search</title>
</head>
<body>

<h2>Gene PDF Search</h2>

<input
    type="text"
    id="gene"
    placeholder="Enter Gene Symbol">

<button onclick="searchGene()">
Search
</button>

<div id="results"></div>

<script>

let mapping = {};
let mappingLoaded = false;

const baseURL = new URL(".", window.location.href);

// Load gene database
fetch(new URL("mapping.json", baseURL))
.then(response => {
    if (!response.ok) {
        throw new Error("mapping.json could not be found");
    }
    return response.json();
})
.then(data => {
    mapping = data;
    mappingLoaded = true;
    console.log("Gene database loaded successfully");
})
.catch(error => {
    document.getElementById("results").innerHTML =
        "<p>Error loading database: " + error.message + "</p>";
});

function searchGene() {

    const gene = document.getElementById("gene")
        .value.trim().toUpperCase();

    const resultsDiv = document.getElementById("results");

    resultsDiv.innerHTML = "";

    if (!mappingLoaded) {
        resultsDiv.innerHTML =
            "<p>Database is still loading. Please wait.</p>";
        return;
    }

    if (!mapping[gene]) {
        resultsDiv.innerHTML = "<p>Gene not found.</p>";
        return;
    }

    let html = `<h3>${gene}</h3>`;

    mapping[gene].forEach(probe => {

    const pdfURL =
        "https://ttsttz.github.io/SEGEL-search-site2/PDF/"
        + probe + ".pdf";

        html += `
            <p>
                ${probe}
                <a href="${pdfURL}" target="_blank">
                    Open PDF
                </a>
            </p>
        `;
    });

    resultsDiv.innerHTML = html;
}

</script>

</body>
</html>
